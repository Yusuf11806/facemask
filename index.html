<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YOLOv8 Real-Time Mask Detection</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  width: 760px;
  max-width: 95%;
  background: #020617;
  padding: 24px;
  border-radius: 18px;
  box-shadow: 0 0 35px rgba(34, 197, 94, 0.3);
}

h1 {
  text-align: center;
  color: #22c55e;
  margin-top: 0;
}

p {
  text-align: center;
  color: #94a3b8;
  margin-bottom: 20px;
}

.camera-box {
  position: relative;
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid #22c55e;
  background-color: #000;
  display: flex;
  justify-content: center;
  align-items: center;
}

video {
  width: 100%;
  height: auto;
  display: block;
}

canvas {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
}

.controls {
  margin-top: 20px;
  display: flex;
  justify-content: center;
  gap: 14px;
}

button {
  padding: 10px 24px;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
  transition: all 0.2s ease;
}

button:hover {
  transform: translateY(-1px);
  opacity: 0.9;
}

.start { background: #22c55e; color: #022c22; }
.stop { background: #ef4444; color: white; }

.status {
  text-align: center;
  margin-top: 16px;
  font-size: 16px;
  font-weight: 600;
  color: #e5e7eb;
}
</style>
</head>

<body>
<div class="container">
  <h1>Mask Detector AI</h1>
  <p>YOLOv8 Real-Time Face Mask Detection</p>

  <div class="camera-box" id="cameraBox">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div class="controls">
    <button class="start" id="startBtn">📷 Start Camera</button>
    <button class="stop" id="stopBtn">⛔ Stop Camera</button>
  </div>

  <div class="status" id="status">Status: Idle</div>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusText = document.getElementById("status");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");

let stream = null;
let running = false;
let isProcessingFrame = false;

// PASTE YOUR RENDER BACKEND URL HERE:
const BACKEND_URL = "https://your-app-name.onrender.com/detect";

function updateCanvasSize() {
  if (video.videoWidth && video.videoHeight) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.style.width = `${video.clientWidth}px`;
    canvas.style.height = `${video.clientHeight}px`;
  }
}

window.addEventListener("resize", updateCanvasSize);

async function startCamera() {
  if (running) return;

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;

    video.onloadedmetadata = () => {
      updateCanvasSize();
      running = true;
      statusText.innerText = "Status: Detecting...";
      sendFrame();
    };
  } catch (err) {
    console.error("Camera access error:", err);
    statusText.innerText = "Status: Failed to access camera";
  }
}

function stopCamera() {
  running = false;
  isProcessingFrame = false;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  video.srcObject = null;
  statusText.innerText = "Status: Camera OFF";
}

async function sendFrame() {
  if (!running) return;

  if (isProcessingFrame) {
    requestAnimationFrame(sendFrame);
    return;
  }

  isProcessingFrame = true;
  updateCanvasSize();

  try {
    const tempCanvas = document.createElement("canvas");
    tempCanvas.width = video.videoWidth;
    tempCanvas.height = video.videoHeight;
    const tempCtx = tempCanvas.getContext("2d");
    tempCtx.drawImage(video, 0, 0);

    const image = tempCanvas.toDataURL("image/jpeg", 0.6);

    const res = await fetch(BACKEND_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image })
    });

    if (res.ok) {
      const detections = await res.json();
      drawDetections(detections);
    }
  } catch (err) {
    console.error("Inference Error:", err);
  } finally {
    isProcessingFrame = false;
    if (running) {
      setTimeout(sendFrame, 100);
    }
  }
}

function drawDetections(dets) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  dets.forEach(d => {
    const [x1, y1, x2, y2] = d.box;
    const labelLower = d.label.toLowerCase();

    let color = "#ef4444";
    if (labelLower.includes("with_mask") || labelLower === "mask") {
      color = "#22c55e";
    } else if (labelLower.includes("incorrect")) {
      color = "#f59e0b";
    }

    const boxWidth = x2 - x1;
    const boxHeight = y2 - y1;

    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.strokeRect(x1, y1, boxWidth, boxHeight);

    const text = `${d.label} ${(d.confidence * 100).toFixed(0)}%`;
    ctx.font = "bold 16px 'Segoe UI', sans-serif";
    const textWidth = ctx.measureText(text).width;

    ctx.fillStyle = color;
    ctx.fillRect(x1 - 1.5, y1 > 28 ? y1 - 26 : y1, textWidth + 12, 26);

    ctx.fillStyle = "#000000";
    ctx.fillText(text, x1 + 5, y1 > 28 ? y1 - 7 : y1 + 18);
  });
}

startBtn.onclick = startCamera;
stopBtn.onclick = stopCamera;
</script>
</body>
</html>
